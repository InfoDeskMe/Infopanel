services:
    database:
     container_name: database_infopanel
     image: mysql:8.0
     command: --default-authentication-plugin=mysql_native_password
     restart: always
     environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required, see .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-symfony_docker}
      MYSQL_USER: ${MYSQL_USER:-symfony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required, see .env.example}
     ports:
      - "4306:3306"
     volumes:
      - ./.development/mysql:/var/lib/mysql
     networks:
      - symfony
     healthcheck:
      # --protocol=tcp: "-h localhost" alone prefers a unix socket, which can
      # go healthy slightly before the TCP listener other containers
      # actually connect through is ready -- a real race hit while testing.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--protocol=tcp", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    frontend:
     container_name: frontend_infopanel
     build:
      context: ./frontend
     ports: 
      - '80:5173'
     volumes:
      - ./frontend/node_modules:/var/www/node_modules
      - ./frontend:/var/www
     depends_on:
     - php 
     networks:
     - symfony 

    php:
     container_name: backend_infopanel
     build:
      context: ./backend
      target: base
     restart: unless-stopped
     ports:
     - '9000:9000'
     volumes:
     - ./backend:/var/www/backend
     depends_on:
      database:
       condition: service_healthy
     networks:
     - symfony

    nginx:
     container_name: nginx
     image: nginx:stable-alpine
     ports:
     - '8080:8080'
     restart: always
     volumes:
     - ./backend:/var/www/backend
     - ./.development/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
     depends_on:
     - php
     - database
     networks:
     - symfony

networks:
  symfony:
    driver: bridge