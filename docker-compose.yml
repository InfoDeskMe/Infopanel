services:
    database:
     container_name: database_infopanel
     image: mysql:8.0
     command: --default-authentication-plugin=mysql_native_password
     restart: unless-stopped
     environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required, see .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-symfony_docker}
      MYSQL_USER: ${MYSQL_USER:-symfony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required, see .env.example}
     # No host port: only the php container needs to reach this, over the
     # internal symfony network. Kept in docker-compose.dev.yml for debugging.
     volumes:
      - mysql_data:/var/lib/mysql
     networks:
     - symfony
     healthcheck:
      # --protocol=tcp: "-h localhost" alone prefers a unix socket, which can
      # go healthy slightly before the TCP listener other containers
      # actually connect through is ready -- a real race hit while testing.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--protocol=tcp", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    php:
     container_name: backend_infopanel
     build:
      context: ./backend
      target: prod
     # No host port: only nginx needs to reach php-fpm, over the internal
     # symfony network. Kept in docker-compose.dev.yml for debugging.
     restart: unless-stopped
     environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required, see .env.example}
      DATABASE_URL: mysql://${MYSQL_USER:-symfony}:${MYSQL_PASSWORD}@database_infopanel:3306/${MYSQL_DATABASE:-symfony_docker}?serverVersion=5.7.40
      MESSENGER_TRANSPORT_DSN: doctrine://default
      TRUSTED_PROXIES: 0.0.0.1,localhost,database_infopanel
     volumes:
      - infopanel_data:/var/www/backend/var/data
      - infopanel_uploads:/var/www/backend/public/uploads
     depends_on:
      database:
       condition: service_healthy
     networks:
     - symfony
     healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    nginx:
     container_name: nginx
     build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
       VITE_API_BASE: /api
     ports:
     - '80:80'
     - '8080:8080'
     restart: unless-stopped
     volumes:
      - infopanel_uploads:/var/www/backend/public/uploads:ro
     depends_on:
      php:
       condition: service_healthy
      database:
       condition: service_healthy
     networks:
     - symfony

networks:
  symfony:
    driver: bridge

volumes:
  mysql_data:
  infopanel_data:
  infopanel_uploads:
