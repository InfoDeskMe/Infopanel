server {

    listen 8080;
    index index.php;
    server_name localhost;
    root /var/www/backend/public;
    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
    client_max_body_size 64M;
    # No CORS header here: the frontend reaches this API same-origin, via the
    # /api/ proxy in the server block below (or Vite's own dev proxy).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Plain, unhashed filenames (public/js/*.js, public/css/*.css) means a
    # deploy can't rely on the URL changing to bust a browser's cache -- an
    # already-open tab can keep running old JS against a changed API
    # indefinitely. no-cache (not no-store) still lets the browser keep the
    # bytes, it just forces a conditional revalidation (If-None-Match) on
    # every load, so a new deploy takes effect on next page load instead of
    # whenever the browser's cache heuristics happen to expire.
    location ~* \\.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\\.php(/|$) {
        fastcgi_pass backend_infopanel:9000;
        fastcgi_split_path_info ^(.+\\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        internal;
    }

    location ~ \\.php$ {
        return 404;
    }

}

server {
    listen 80;
    server_name localhost;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # avoid duplicating the security headers the 8080 block already sets
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Uploaded images/videos: the backoffice (port 8080) stores absolute
    # http://<host>/uploads/... URLs in content records (see
    # backend/public/js/upload.js putSelectedImage()), so the public panel
    # on this port has to serve them directly too. Served straight from the
    # infopanel_uploads volume/bind-mount, not proxied to php -- these are
    # static files, no need to round-trip through fastcgi.
    location /uploads/ {
        alias /var/www/backend/public/uploads/;
    }

    location / {
        root /var/www/frontend/dist;
        index index.html index.htm;
    }
}
